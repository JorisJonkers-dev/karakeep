# Tag-triggered publish: the three images, then the Intent Fragment the estate composes.
#
# push of a v*.*.* tag (authored by release.yml via the App token) drives:
#   publish-karakeep + publish-chrome + publish-search -> resolve-image-lock -> fragment
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  publish-karakeep:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@870429202376dac2e9434746941c54f9a2be605f # v0.33.0
    with:
      image-name: karakeep
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      context: karakeep
      dockerfile: karakeep/Dockerfile
      platforms: linux/amd64 # karakeep's image is published for amd64 only
    permissions:
      contents: read
      packages: write

  publish-chrome:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@870429202376dac2e9434746941c54f9a2be605f # v0.33.0
    with:
      image-name: karakeep-chrome
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      context: chrome
      dockerfile: chrome/Dockerfile
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write

  publish-search:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@870429202376dac2e9434746941c54f9a2be605f # v0.33.0
    with:
      image-name: karakeep-search
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      context: search
      dockerfile: search/Dockerfile
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write

  # The images lock: each pushed digest, under the alias the project file names, with the
  # user the image runs as, read from what was pushed.
  resolve-image-lock:
    needs: [publish-karakeep, publish-chrome, publish-search]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      images-lock-artifact: ${{ steps.lock.outputs.images-lock-artifact }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # The commit the release was cut from, so the fragment names it however publish was started.
      - name: source-commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The shared step also reads back the software version each image ships.
      - name: lock-images
        id: lock
        uses: JorisJonkers-dev/github-workflows/actions/resolve-image-lock@870429202376dac2e9434746941c54f9a2be605f # v0.33.0
        with:
          name: karakeep
          images: |
            karakeep
            karakeep-chrome
            karakeep-search
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  fragment:
    needs: [resolve-image-lock]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-fragment.yml@79e57122f7ed1fb442c90a7487f861c5d1465ec6 # v0.34.0
    with:
      project-file: deploy/karakeep.project.yml
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ref: ${{ needs.resolve-image-lock.outputs.source-sha }}
      validate-with: deploy/env
      images-lock-artifact: ${{ needs.resolve-image-lock.outputs.images-lock-artifact }}
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
